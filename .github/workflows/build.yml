name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tools
        run: |
          mkdir -p tools
          curl -fsSLo tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$BT" >> "$GITHUB_PATH"

      - name: Build
        env:
          VERSION: r${{ github.run_number }}
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OneUIShade-r${{ github.run_number }}
          path: out/*.zip

      - name: Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r${{ github.run_number }}" out/*.zip \
            --title "r${{ github.run_number }}" \
            --notes "Commit ${GITHUB_SHA::7}. Magisk'ten kur, yeniden başlat. Sorun olursa açılışta Ses Kısma ile güvenli mod."
